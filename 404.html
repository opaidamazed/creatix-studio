<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Creatix Bot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GitHub Pages SPA fallback: /repo/dashboard  ->  /repo/?/dashboard (index.html restores the clean URL) -->
<script>
(function (l) {
  var keep = l.hostname.endsWith('github.io') ? 1 : 0;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + keep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
})(window.location);
</script>
</head>
<body style="background:#10002b;color:#f3e9ff;font-family:system-ui,Tahoma,sans-serif;text-align:center;padding-top:20vh">
جارٍ التحويل…
</body>
</html>
