<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Creatix Bot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10002b"/><stop offset="1" stop-color="#3c096c"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9d4edd" stroke-opacity=".22"/></pattern>
    <radialGradient id="m" cx=".5" cy=".4" r=".65"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="k"><rect width="1200" height="320" fill="url(#m)"/></mask>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#e0aaff"/><stop offset="1" stop-color="#9d4edd"/></linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#g)" mask="url(#k)"/>
  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="88" font-weight="700" fill="#f3e9ff">Creatix <tspan fill="url(#t)">Bot</tspan></text>
  <text x="600" y="208" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#b79ad6">Arabic-first Discord bot with a web dashboard</text>
  <rect x="540" y="240" width="120" height="4" rx="2" fill="#9d4edd"/>
</svg>
